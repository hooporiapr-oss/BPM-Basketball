<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ball Dribble Test | BPM Basketball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#stage{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(ellipse at center,#180000 0%,#000 70%);
}

#bpmReadout{
  font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:2rem;color:#ffd35a;
  text-shadow:0 0 30px rgba(255,211,90,.6);letter-spacing:.04em;text-align:center;
}
#bpmReadout span{font-size:1rem;color:#9fb3c8;letter-spacing:.2em;text-transform:uppercase;display:block;margin-top:4px;font-weight:700}

#courtWrap{width:200px;height:280px;position:relative}

/* Floor — a real ground reference now that there's no figure to
   imply one. The shadow beneath it stretches and fades with the
   ball's own height, so the bounce still reads as hitting a surface. */
#floorLine{position:absolute;left:0;right:0;bottom:24px;height:2px;background:linear-gradient(90deg,transparent,rgba(124,58,237,.5),transparent)}
#floorShadow{
  position:absolute;bottom:16px;left:50%;width:70px;height:16px;border-radius:50%;
  background:rgba(124,58,237,.35);transform:translate(-50%,0);
  transition:transform .05s linear,opacity .05s linear;
}

/* Ball — same real seam-line texture used everywhere else on the
   platform, so this is recognizably the same ball, not a new prop. */
#ball{
  width:64px;height:64px;border-radius:50%;position:absolute;
  background:
    url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2249%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22none%22%20stroke%3D%22%23231005%22%20stroke-width%3D%224%22%3E%3Cline%20x1%3D%2250%22%20y1%3D%22-4%22%20x2%3D%2250%22%20y2%3D%22104%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20-4%20104%2050%22/%3E%3Cpath%20d%3D%22M%20-4%2050%20Q%2050%20104%20104%2050%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2250%22%20rx%3D%2224%22%20ry%3D%2249%22/%3E%3C/g%3E%3C/svg%3E'),
    radial-gradient(circle at 35% 32%,#ffb35c,#ff8c00 55%,#d9660a 85%);
  background-size:100% 100%,100% 100%;
  box-shadow:0 0 26px rgba(255,140,0,.75);
  left:50%;top:0;
  transform-origin:center center;
}

.controls{display:flex;gap:10px;align-items:center}
.controls button{
  height:44px;padding:0 18px;border:2px solid rgba(255,30,60,.5);background:rgba(255,30,60,.08);
  color:#fff;font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:.85rem;letter-spacing:.06em;
  text-transform:uppercase;border-radius:12px;cursor:pointer
}
.controls button:active{background:rgba(255,30,60,.3)}
.controls input[type=range]{width:180px}
</style>
</head>
<body>
<div id="stage">
  <div id="bpmReadout">120<span>BPM · Dribble Rate</span></div>

  <div id="courtWrap">
    <div id="floorShadow"></div>
    <div id="floorLine"></div>
    <div id="ball"></div>
  </div>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <input type="range" id="bpmSlider" min="60" max="220" value="120">
  </div>
</div>

<script>
var ball = document.getElementById('ball');
var floorShadow = document.getElementById('floorShadow');
var bpmReadout = document.getElementById('bpmReadout');
var playBtn = document.getElementById('playBtn');
var bpmSlider = document.getElementById('bpmSlider');

var playing = false;
var rafId = null;
var cycleStart = 0;
var bpm = 120;

var TOP_Y = 20;   // ball's top position (svg-like px units within #courtWrap)
var FLOOR_Y = 200; // where the ball's center sits at the bottom of the bounce

// One full bounce cycle: the ball drops from its highest point,
// compresses slightly on floor contact, then rises back up. A real
// parabolic arc, not a linear slide, with a genuine squash-and-stretch
// on impact so the bounce reads as hitting a real surface.
function frame(progress){
  var height = 4 * progress * (1 - progress); // 0 at both ends, 1 at the peak
  var travel = FLOOR_Y - TOP_Y;
  var y = TOP_Y + travel * (1 - height);
  ball.style.top = y + 'px';
  ball.style.left = '100px';

  // Squash grows the closer the ball gets to the floor, easing back to
  // its true round shape at the peak — subtle, not cartoonish.
  var nearFloor = 1 - height; // 1 at the floor, 0 at the peak
  var squash = 1 - nearFloor * 0.16;
  var stretch = 1 + nearFloor * 0.16;
  ball.style.transform = 'translate(-50%,-50%) scale(' + stretch + ',' + squash + ')';

  // The floor shadow grows and darkens as the ball nears the ground,
  // shrinks and fades as it rises — a cheap but effective depth cue.
  var shadowScale = 0.55 + nearFloor * 0.6;
  floorShadow.style.transform = 'translate(-50%,0) scale(' + shadowScale + ')';
  floorShadow.style.opacity = 0.2 + nearFloor * 0.4;
}

function loop(ts){
  if(!playing)return;
  if(!cycleStart)cycleStart = ts;
  var beatMs = 60000 / bpm;
  var elapsed = (ts - cycleStart) % beatMs;
  var progress = elapsed / beatMs;
  frame(progress);
  rafId = requestAnimationFrame(loop);
}

playBtn.addEventListener('click', function(){
  playing = !playing;
  playBtn.textContent = playing ? '⏸ Pause' : '▶ Play';
  if(playing){
    cycleStart = 0;
    rafId = requestAnimationFrame(loop);
  }else{
    cancelAnimationFrame(rafId);
  }
});

bpmSlider.addEventListener('input', function(){
  bpm = parseInt(bpmSlider.value, 10);
  bpmReadout.childNodes[0].textContent = bpm;
  cycleStart = 0; // resync so the tempo change doesn't jump mid-cycle
});

// Draw one static frame at rest so the ball isn't blank before Play is pressed.
frame(0);
</script>
</body>
</html>
